[pytest]
pythonpath = .
testpaths = tests
# `legacy/` holds the retired v1 generation and its tests. Excluded rather than deleted --
# see legacy/tests/README.md. Run them explicitly with `pytest legacy/tests` if needed.
norecursedirs = legacy .git .claude wandb results
markers =
    slow: takes more than ~5s. Deselect with `-m "not slow"` for a fast local loop; CI and
        any commit touching ma/ or sa/ must run the full suite.
    perf: asserts on wall-clock timing. Inherently flaky under CPU contention -- these
        measure a real property but cannot be trusted when anything else is running.
